services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - "4000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI}
    depends_on:
      - mongodb

    stdin_open: true
    tty: true

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: